<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Peleja do Tocantins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bitter:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Conceito: folheto de cordel — xilogravura em papel pardo, duas tintas (preta e vermelha), a guerra contada em sextilhas */
:root {
  --pardo: #d8c194; --pardo-claro: #e9d8b2; --tinta: #17120d; --vermelho: #b02a1f; --vermelho-escuro: #7d1a12;
  --f-tit: 'Alfa Slab One', 'Rockwell', Georgia, serif; --f-texto: 'Bitter', Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--pardo); color: var(--tinta); font-family: var(--f-texto); }
#livro { position: fixed; inset: 0; display: grid; grid-template-columns: 380px 1fr; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#folheto { background: var(--pardo-claro); border-right: 6px double var(--tinta); overflow: auto; padding: 18px 22px 22px max(22px, env(safe-area-inset-left, 0px)); position: relative; }
#folheto::before { content: ''; position: absolute; inset: 8px; border: 2px solid var(--tinta); pointer-events: none; }
.capa { text-align: center; border-bottom: 3px solid var(--tinta); padding-bottom: 12px; margin-bottom: 12px; }
.capa .autor { font: 600 12px var(--f-texto); letter-spacing: .3em; text-transform: uppercase; }
.capa h1 { font: 400 30px/1 var(--f-tit); margin: 8px 0 6px; text-transform: uppercase; }
.capa h1 em { font-style: normal; color: var(--vermelho); display: block; font-size: 22px; margin-top: 4px; }
.capa canvas { width: 100%; max-width: 300px; height: 120px; display: block; margin: 8px auto 0; }
.verso { font: italic 16px/1.5 var(--f-texto); margin: 0 0 14px; padding-left: 14px; border-left: 4px solid var(--vermelho); white-space: pre-line; min-height: 9em; }
.titulo-sec { font: 400 15px var(--f-tit); text-transform: uppercase; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
.titulo-sec::after { content: ''; flex: 1; height: 3px; background: repeating-linear-gradient(90deg, var(--tinta) 0 6px, transparent 6px 9px); }
.almanaque { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 2px solid var(--tinta); }
.almanaque div { padding: 6px 8px; border: 1px solid var(--tinta); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
.almanaque b { display: block; font: 400 19px var(--f-tit); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.almanaque div:nth-child(4n+1), .almanaque div:nth-child(4n) { background: #d9c59c; }
.ordens { display: flex; flex-wrap: wrap; gap: 6px; }
.ordens button { font: 600 12.5px var(--f-texto); background: var(--pardo-claro); color: var(--tinta); border: 2px solid var(--tinta); padding: 5px 9px; cursor: pointer; box-shadow: 2px 2px 0 var(--tinta); }
.ordens button:hover, .ordens button[aria-pressed="true"] { background: var(--vermelho); color: var(--pardo-claro); }
.virar { margin-top: 16px; width: 100%; font: 400 20px var(--f-tit); text-transform: uppercase; background: var(--vermelho); color: var(--pardo-claro); border: 3px solid var(--tinta); box-shadow: 4px 4px 0 var(--tinta); padding: 12px; cursor: pointer; }
.virar:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--tinta); } .virar:disabled { opacity: .6; }
.virar:focus-visible, .ordens button:focus-visible { outline: 3px dashed var(--vermelho); outline-offset: 3px; }
#mapa-wrap { position: relative; overflow: hidden; }
canvas#mapa { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.selo { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); top: 16px; width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--vermelho); color: var(--vermelho); display: grid; place-items: center; text-align: center; font: 400 15px/1.05 var(--f-tit); transform: rotate(-12deg); pointer-events: none; mix-blend-mode: multiply; }
.selo small { display: block; font: 600 10px var(--f-texto); letter-spacing: .15em; }
.zoom { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); bottom: 18px; display: flex; gap: 6px; }
.zoom button, .galeria { width: 38px; height: 38px; background: var(--pardo-claro); border: 2px solid var(--tinta); box-shadow: 2px 2px 0 var(--tinta); font: 400 18px var(--f-tit); cursor: pointer; color: var(--tinta); }
.galeria { width: auto; padding: 0 10px; display: grid; place-items: center; text-decoration: none; font-size: 13px; }
#ficha { position: absolute; z-index: 3; width: 250px; background: var(--pardo-claro); border: 3px solid var(--tinta); box-shadow: 5px 5px 0 var(--tinta); padding: 10px 12px; font-size: 13px; line-height: 1.4; }
#ficha h4 { font: 400 17px var(--f-tit); margin: 0 0 4px; text-transform: uppercase; }
#ficha .fx { position: absolute; right: 6px; top: 2px; background: none; border: 0; font: 400 18px var(--f-tit); cursor: pointer; }
@media (max-width: 860px) { #livro { grid-template-columns: 1fr; grid-template-rows: 58% 42%; } #folheto { order: 2; border-right: 0; border-top: 6px double var(--tinta); padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); } .capa canvas { display: none; } .selo { width: 80px; height: 80px; font-size: 11px; } }
</style>
</head>
<body>
<div id="livro">
  <aside id="folheto">
    <div class="capa">
      <div class="autor">Folheto da UPR · Nº 14</div>
      <h1>A Peleja do Tocantins<em>e o cerco de Imperatriz</em></h1>
      <canvas id="xilo" aria-label="Xilogravura de capa"></canvas>
    </div>
    <p class="verso" id="verso"></p>
    <div class="titulo-sec">Almanaque da luta</div>
    <div class="almanaque" id="alm"></div>
    <div class="titulo-sec">Ordens da coluna</div>
    <div class="ordens" id="ordens"></div>
    <button class="virar" id="turno">Virar a folha ▸</button>
  </aside>
  <div id="mapa-wrap">
    <canvas id="mapa" aria-label="Mapa em xilogravura"></canvas>
    <div class="selo" id="selo"><div><small>CANTO</small><span id="mes">MARÇO</span><small>DE 2028</small></div></div>
    <div class="zoom"><a class="galeria" href="index.html">Galeria</a><button id="zi" aria-label="Aproximar">+</button><button id="zo" aria-label="Afastar">−</button><button id="zf" aria-label="Enquadrar">◎</button></div>
    <div id="ficha" hidden></div>
  </div>
</div>
<script src="base/geo.js"></script>
<script src="base/cenario.js"></script>
<script src="base/dados.js"></script>
<script>
(function () {
  const C = Cenario, G = C.G, D = DADOS;
  const T = '#17120d', V = '#b02a1f', PC = '#e9d8b2', P = '#d8c194';
  const cv = document.getElementById('mapa'), ctx = cv.getContext('2d');

  const VERSOS = [
    'Em março de vinte e oito\na coluna se moveu,\ndesceu pelo Araguaia\ne a Linha estremeceu;\nem Imperatriz cercada\na brigada emudeceu.',
    'No Recife o operário\npegou fuzil e facão,\nfuzileiro desembarca\npra tomar a região,\nmas a milícia resiste\nna praça e no casarão.',
    'Lá no Sul, a tal da Liga\nquer a sua separação,\nmarcha pra Porto Alegre\ncom bandeira e com canhão;\no governo, dividido,\njá não sabe a direção.',
    'No Tapajós, isolado,\nresiste um destacamento,\nsem estrada e sem comida,\nsó com fé e armamento;\nou recua pela mata\nou se acaba no tormento.'
  ];

  // texturas
  function pat(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
  const falhas = pat(160, 160, (g, w, h) => { for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.9})`; const r = Math.random() < 0.9 ? Math.random() * 1.2 : Math.random() * 3; g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, r, r * (0.4 + Math.random()), Math.random() * 3, 0, 7); g.fill(); } });
  const goiva = pat(48, 48, (g) => { g.strokeStyle = 'rgba(23,18,13,.32)'; g.lineCap = 'round'; for (let i = 0; i < 7; i++) { const x = Math.random() * 48, y = Math.random() * 48, l = 3 + Math.random() * 6; g.lineWidth = 0.6 + Math.random(); g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 1.5, x + l, y); g.stroke(); } });
  const hachura = pat(9, 9, (g) => { g.strokeStyle = 'rgba(23,18,13,.55)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(-2, 11); g.lineTo(11, -2); g.stroke(); });
  const xadrez = pat(10, 10, (g) => { g.strokeStyle = T; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, 10); g.lineTo(10, 0); g.moveTo(0, 0); g.lineTo(10, 10); g.stroke(); });

  const countryPaths = G.countries.map(c => ({ ...c, path: new Path2D(c.d) }));
  const riverPaths = G.rivers.filter(r => r.r <= 6).map(r => ({ ...r, path: new Path2D(r.d) }));
  const land = new Path2D(); countryPaths.forEach(c => land.addPath(c.path)); land.addPath(C.brasil);
  // picos de serra entalhados: amostras dentro das serras
  const picos = [];
  (function () { const g = document.createElement('canvas').getContext('2d'); G.relief.filter(r => /Range/.test(r.k)).forEach(r => { const p = new Path2D(r.d); const nums = r.d.match(/-?\d+\.?\d*/g).map(Number); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (let i = 0; i < nums.length; i += 2) { x0 = Math.min(x0, nums[i]); x1 = Math.max(x1, nums[i]); y0 = Math.min(y0, nums[i + 1]); y1 = Math.max(y1, nums[i + 1]); } const big = /Andes|Cordilheira/.test(r.n); const st = big ? 15 : 11; for (let y = y0; y < y1; y += st) for (let x = x0; x < x1; x += st) { const jx = x + (C.hash(x | 0, y | 0) - 0.5) * st * 0.8, jy = y + (C.hash(y | 0, x | 0) - 0.5) * st * 0.8; if (g.isPointInPath(p, jx, jy)) picos.push([jx, jy, big ? 7 + C.hash(jx | 0, 3) * 4 : 4 + C.hash(jx | 0, 5) * 3]); } }); })();

  let fr = {}, dirty = true;
  function rebuild() { for (const f of [1, 2]) fr[f] = C.chains(C.contour(f)).map(l => C.smoothChain(l, 1)); dirty = false; }
  const off = document.createElement('canvas'), o = off.getContext('2d');

  const t0 = performance.now(); let sel = null;
  const cam = C.camera(cv, () => {}, { pad: [20, 20, 20, 20], focus: [360, 120, 980, 900], onClick: m => clickAt(m), onHover: m => { cv.style.cursor = m && unitAt(m) ? 'pointer' : 'grab'; } });

  function line(pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); }
  function chainPath(chs) { const p = new Path2D(); chs.forEach(l => { l.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); p.closePath(); }); return p; }

  function inkLayer(drawFn, offset, cor) {
    off.width = cv.width; off.height = cv.height; o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, off.width, off.height);
    o.setTransform(cam.dpr * cam.k, 0, 0, cam.dpr * cam.k, cam.dpr * cam.x, cam.dpr * cam.y); drawFn(o);
    o.setTransform(1, 0, 0, 1, 0, 0); o.globalCompositeOperation = 'destination-out'; o.fillStyle = o.createPattern(falhas, 'repeat'); o.globalAlpha = 0.55; o.fillRect(0, 0, off.width, off.height); o.globalAlpha = 1; o.globalCompositeOperation = 'source-over';
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(off, offset[0] * cam.dpr, offset[1] * cam.dpr); ctx.restore();
  }

  function draw() {
    if (dirty) rebuild();
    const t = (performance.now() - t0) / 1000, k = cam.k;
    cam.screen(ctx); ctx.fillStyle = P; ctx.fillRect(0, 0, cam.w, cam.h);
    // mar: linhas de onda entalhadas
    cam.apply(ctx); ctx.strokeStyle = T; ctx.lineCap = 'round';
    for (let y = -150, r = 0; y < G.vh + 150; y += 11, r++) { ctx.lineWidth = (1.1 + (r % 3 === 0 ? 0.8 : 0)) / Math.sqrt(k); ctx.beginPath(); let on = true; for (let x = -300; x < G.vw + 300; x += 6) { const yy = y + Math.sin(x * 0.045 + r * 1.7) * 3; const gap = C.hash(Math.floor(x / 40), r) < 0.12; if (gap) { on = false; continue; } if (!on) { ctx.moveTo(x, yy); on = true; } else ctx.lineTo(x, yy); } ctx.stroke(); }
    // terra
    ctx.save(); ctx.lineWidth = 9 / k; ctx.strokeStyle = P; ctx.stroke(land); ctx.restore();
    ctx.fillStyle = PC; ctx.fill(land);
    cam.screen(ctx); ctx.save(); cam.apply(ctx); ctx.clip(land); cam.screen(ctx); ctx.fillStyle = ctx.createPattern(goiva, 'repeat'); ctx.fillRect(0, 0, cam.w, cam.h); ctx.restore(); cam.apply(ctx);
    // vizinhos em hachura
    ctx.save(); countryPaths.forEach(c => ctx.fill(c.path)); ctx.restore();
    ctx.save(); const vz = new Path2D(); countryPaths.forEach(c => vz.addPath(c.path)); ctx.clip(vz); cam.screen(ctx); ctx.fillStyle = ctx.createPattern(hachura, 'repeat'); ctx.globalAlpha = 0.9; ctx.fillRect(0, 0, cam.w, cam.h); ctx.restore(); cam.apply(ctx);
    ctx.fillStyle = PC; ctx.globalAlpha = 0; ctx.globalAlpha = 1;
    // rios
    ctx.strokeStyle = T; riverPaths.forEach(r => { ctx.lineWidth = (r.r <= 3 ? 1.6 : 0.9) / k; ctx.stroke(r.path); });
    // picos
    ctx.lineJoin = 'miter'; picos.forEach(([x, y, s]) => { const ss = s; ctx.fillStyle = PC; ctx.beginPath(); ctx.moveTo(x - ss, y + ss * 0.55); ctx.lineTo(x, y - ss * 0.8); ctx.lineTo(x + ss, y + ss * 0.55); ctx.closePath(); ctx.fill(); ctx.lineWidth = 1.1 / Math.sqrt(k); ctx.strokeStyle = T; ctx.stroke(); ctx.beginPath(); for (let i = 1; i < 4; i++) { ctx.moveTo(x - ss * i / 4.5, y - ss * 0.8 + ss * 1.35 * i / 4); ctx.lineTo(x - ss * 0.05, y + ss * 0.5); } ctx.lineWidth = 0.7 / Math.sqrt(k); ctx.stroke(); });
    // estados e costa (traço grosso irregular)
    ctx.strokeStyle = T; ctx.lineWidth = 0.8 / k; ctx.setLineDash([3 / k, 2 / k]); C.states.forEach(s => ctx.stroke(s.path)); ctx.setLineDash([]);
    ctx.lineWidth = 1.2 / k; countryPaths.forEach(c => ctx.stroke(c.path));
    ctx.lineWidth = 2.6 / k; ctx.stroke(land);
    // território em tinta vermelha (com falha de registro)
    const p1 = chainPath(fr[1]), p2 = chainPath(fr[2]);
    inkLayer(g => { g.fillStyle = V; g.fill(p1, 'evenodd'); }, [2, 1.5]);
    inkLayer(g => { g.save(); g.clip(p2, 'evenodd'); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = g.createPattern(xadrez, 'repeat'); g.fillRect(0, 0, off.width, off.height); g.restore(); }, [0, 0]);
    cam.apply(ctx);
    // linha de frente serrilhada
    ctx.strokeStyle = T; ctx.lineJoin = 'miter';
    for (const f of [1, 2]) fr[f].forEach(l => { ctx.lineWidth = 2.8 / k; line(l); ctx.lineWidth = 1.4 / k; saw(l, 4.5 / k); });
    // fortificação: estacas
    C.FORTIFICACOES.forEach(fo => { ctx.lineWidth = 2 / k; line(fo.p); stakes(fo.p, 6 / k); });
    // suprimento: pegadas
    C.SUPRIMENTO.forEach(s => { ctx.strokeStyle = s.ok ? V : T; ctx.lineWidth = 1.6 / k; ctx.setLineDash([1 / k, 5 / k]); ctx.lineCap = 'round'; line(s.p); ctx.setLineDash([]); });
    // setas entalhadas
    C.SETAS.forEach((s, i) => woodArrow(s, k, Math.min(1, Math.max(0, (t - i * 0.2) / 1))));
    // ---- tela ----
    cam.screen(ctx); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    countryPaths.forEach(c => { if (!c.lp) return; const p = cam.toScreen(c.lp); ctx.font = `400 ${Math.min(17, 11 * Math.sqrt(k))}px "Alfa Slab One"`; ctx.lineWidth = 4; ctx.strokeStyle = PC; ctx.strokeText(c.n.toUpperCase(), p[0], p[1]); ctx.fillStyle = T; ctx.fillText(c.n.toUpperCase(), p[0], p[1]); });
    ctx.font = `400 ${Math.min(22, 15 * Math.sqrt(k))}px "Alfa Slab One"`; const oc = cam.toScreen([880, 760]); ctx.lineWidth = 6; ctx.strokeStyle = P; ctx.strokeText('MAR ATLÂNTICO', oc[0], oc[1]); ctx.fillStyle = T; ctx.fillText('MAR ATLÂNTICO', oc[0], oc[1]);
    ctx.textAlign = 'left';
    C.CIDADES.forEach(c => { if (!c.br) return; if (c.k === 'est' && k < 1.2) return; const p = cam.toScreen(c.p); ctx.fillStyle = T; ctx.beginPath(); ctx.arc(p[0], p[1], c.k === 'nac' ? 5 : 3, 0, 7); ctx.fill(); if (c.k === 'nac') { ctx.fillStyle = PC; ctx.beginPath(); ctx.arc(p[0], p[1], 2, 0, 7); ctx.fill(); } ctx.font = `${c.k === 'est' ? 'italic 400' : '600'} ${c.k === 'est' ? 11 : 12.5}px Bitter`; ctx.lineWidth = 3; ctx.strokeStyle = PC; ctx.strokeText(c.n, p[0] + 6, p[1] - 5); ctx.fillStyle = T; ctx.fillText(c.n, p[0] + 6, p[1] - 5); });
    C.COMBATES.forEach((c, i) => boom(cam.toScreen(c.p), 12 + c.int * 3, t, i));
    C.UNIDADES.forEach(u => stamp(u, cam.toScreen(u.p)));
  }
  function saw(pts, s) { ctx.beginPath(); let acc = 0; for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; const L = Math.hypot(b[0] - a[0], b[1] - a[1]); acc += L; if (acc < s * 2) continue; acc = 0; const nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L; ctx.moveTo(b[0], b[1]); ctx.lineTo(b[0] + nx * s, b[1] + ny * s); } ctx.stroke(); }
  function stakes(pts, s) { for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1]; const L = Math.hypot(b[0] - a[0], b[1] - a[1]); const ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L; for (let d = 0; d < L; d += s * 1.4) { const x = a[0] + ux * d, y = a[1] + uy * d; ctx.beginPath(); ctx.moveTo(x - uy * s * 0.2, y + ux * s * 0.2); ctx.lineTo(x + uy * s, y - ux * s); ctx.stroke(); } } }
  function woodArrow(s, k, pr) {
    if (pr <= 0) return; const pts = C.arrowPath(s, pr); if (pts.length < 3) return;
    const w = (s.f === 1 ? 12 : 9) / k, head = w * 1.15;
    const e = pts[pts.length - 1], q = pts[pts.length - 4] || pts[0]; const L = Math.hypot(e[0] - q[0], e[1] - q[1]) || 1, ux = (e[0] - q[0]) / L, uy = (e[1] - q[1]) / L;
    const body = pts.filter(p => Math.hypot(p[0] - e[0], p[1] - e[1]) > head * 1.25); if (!body.length) return;
    const side = sg => body.map((p, i) => { const a = body[Math.max(0, i - 1)], b = body[Math.min(body.length - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; const ww = w / 2 * (0.5 + 0.5 * i / body.length) * (1 + (C.hash(i, sg + 5) - 0.5) * 0.15); return [p[0] - dy / l * ww * sg, p[1] + dx / l * ww * sg]; });
    const A = side(1), B = side(-1).reverse(); const bx = e[0] - ux * head * 1.25, by = e[1] - uy * head * 1.25;
    const path = new Path2D(); A.forEach((p, i) => i ? path.lineTo(p[0], p[1]) : path.moveTo(p[0], p[1])); path.lineTo(bx - uy * head, by + ux * head); path.lineTo(e[0], e[1]); path.lineTo(bx + uy * head, by - ux * head); B.forEach(p => path.lineTo(p[0], p[1])); path.closePath();
    ctx.fillStyle = s.f === 1 ? V : T; ctx.fill(path); ctx.strokeStyle = T; ctx.lineWidth = 1.8 / k; ctx.stroke(path);
    // talhos brancos na seta
    ctx.save(); ctx.clip(path); ctx.strokeStyle = PC; ctx.lineWidth = 1.4 / k; for (let i = 2; i < body.length - 1; i += 3) { const p = body[i], n = body[i + 1]; const dx = n[0] - p[0], dy = n[1] - p[1], l = Math.hypot(dx, dy) || 1; ctx.beginPath(); ctx.moveTo(p[0] - dy / l * w * 0.3, p[1] + dx / l * w * 0.3); ctx.lineTo(p[0] + dx / l * w * 0.5, p[1] + dy / l * w * 0.5); ctx.lineTo(p[0] + dy / l * w * 0.3, p[1] - dx / l * w * 0.3); ctx.stroke(); } ctx.restore();
  }
  function boom(p, r, t, i) { const [x, y] = p; ctx.save(); ctx.translate(x, y); ctx.rotate(Math.floor(t * 3 + i) % 2 ? 0.05 : -0.05); ctx.beginPath(); const n = 9; for (let j = 0; j < n * 2; j++) { const a = j * Math.PI / n; const rr = j % 2 ? r * 0.42 : r * (0.85 + C.hash(j, i) * 0.4); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fillStyle = T; ctx.fill(); ctx.beginPath(); for (let j = 0; j < 14; j++) { const a = j * Math.PI / 7; const rr = j % 2 ? r * 0.2 : r * 0.48; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fillStyle = V; ctx.fill(); ctx.restore(); }
  function stamp(u, p) {
    const [x, y] = p; ctx.save(); ctx.lineWidth = sel === u ? 3.5 : 2;
    if (u.f === 1) { ctx.fillStyle = V; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.fill(); ctx.strokeStyle = T; ctx.stroke(); ctx.fillStyle = PC; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 3 : 7.5; ctx.lineTo(x + Math.cos(a) * r, y - 2 + Math.sin(a) * r); } ctx.fill(); }
    else if (u.f === 0) { ctx.fillStyle = T; ctx.beginPath(); ctx.moveTo(x - 12, y - 13); ctx.lineTo(x + 12, y - 13); ctx.lineTo(x + 12, y + 2); ctx.quadraticCurveTo(x + 12, y + 12, x, y + 16); ctx.quadraticCurveTo(x - 12, y + 12, x - 12, y + 2); ctx.closePath(); ctx.fill(); ctx.strokeStyle = PC; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x - 7, y - 8); ctx.lineTo(x + 7, y - 8); ctx.moveTo(x - 7, y - 3); ctx.lineTo(x + 7, y - 3); ctx.stroke(); if (sel === u) { ctx.strokeStyle = V; ctx.lineWidth = 3; ctx.stroke(); } }
    else { ctx.fillStyle = PC; ctx.beginPath(); ctx.moveTo(x, y - 15); ctx.lineTo(x + 13, y); ctx.lineTo(x, y + 15); ctx.lineTo(x - 13, y); ctx.closePath(); ctx.fill(); ctx.strokeStyle = T; ctx.stroke(); ctx.save(); ctx.clip(); ctx.fillStyle = ctx.createPattern(xadrez, 'repeat'); ctx.fillRect(x - 15, y - 15, 30, 30); ctx.restore(); }
    // número entalhado
    ctx.font = '400 11px "Alfa Slab One"'; ctx.textAlign = 'center'; const txt = (u.forca / 1000).toFixed(1) + 'k'; ctx.lineWidth = 3; ctx.strokeStyle = PC; ctx.strokeText(txt, x, y + 26); ctx.fillStyle = T; ctx.fillText(txt, x, y + 26);
    if (u.post === 'cercada') { ctx.strokeStyle = V; ctx.lineWidth = 2.5; ctx.beginPath(); for (let a = 0; a < 6.3; a += 0.35) { ctx.moveTo(x + Math.cos(a) * 24, y + Math.sin(a) * 24); ctx.lineTo(x + Math.cos(a + 0.18) * 30, y + Math.sin(a + 0.18) * 30); } ctx.stroke(); }
    ctx.restore();
  }

  // ---- xilogravura da capa (paisagem de sertão com coluna em marcha) ----
  (function capa() {
    const c = document.getElementById('xilo'); const r = c.getBoundingClientRect(); if (!r.width) return; c.width = r.width * 2; c.height = r.height * 2; const g = c.getContext('2d'); g.scale(2, 2); const W = r.width, H = r.height;
    g.fillStyle = T; g.fillRect(0, 0, W, H);
    g.fillStyle = V; g.beginPath(); g.arc(W * 0.72, H * 0.42, 26, Math.PI, 0); g.fill();
    g.strokeStyle = V; g.lineWidth = 2; for (let i = 0; i < 11; i++) { const a = Math.PI + (i + 0.5) * Math.PI / 11; g.beginPath(); g.moveTo(W * 0.72 + Math.cos(a) * 32, H * 0.42 + Math.sin(a) * 32); g.lineTo(W * 0.72 + Math.cos(a) * 52, H * 0.42 + Math.sin(a) * 52); g.stroke(); }
    g.fillStyle = PC; g.beginPath(); g.moveTo(0, H * 0.62); for (let x = 0; x <= W; x += 8) g.lineTo(x, H * 0.62 - Math.sin(x * 0.03) * 8 - (x > W * 0.2 && x < W * 0.45 ? 18 * Math.sin((x - W * 0.2) / (W * 0.25) * Math.PI) : 0)); g.lineTo(W, H); g.lineTo(0, H); g.fill();
    g.strokeStyle = T; g.lineWidth = 1.3; for (let y = H * 0.7; y < H; y += 6) { g.beginPath(); for (let x = 0; x < W; x += 10) g.lineTo(x, y + Math.sin(x * 0.2 + y) * 1.5); g.stroke(); }
    // mandacaru
    g.fillStyle = T; [[W * 0.12, 1], [W * 0.88, 0.8]].forEach(([x, s]) => { g.fillRect(x - 4 * s, H * 0.3, 8 * s, H * 0.4); g.fillRect(x - 16 * s, H * 0.42, 6 * s, 18 * s); g.fillRect(x - 16 * s, H * 0.55, 14 * s, 5 * s); g.fillRect(x + 10 * s, H * 0.36, 6 * s, 20 * s); g.fillRect(x + 4 * s, H * 0.5, 10 * s, 5 * s); });
    // coluna em marcha (silhuetas com bandeira)
    for (let i = 0; i < 7; i++) { const x = W * 0.28 + i * 22, y = H * 0.66; g.fillStyle = T; g.beginPath(); g.arc(x, y - 22, 4, 0, 7); g.fill(); g.fillRect(x - 3, y - 18, 6, 14); g.fillRect(x - 3, y - 5, 2.5, 10); g.fillRect(x + 0.5, y - 5, 2.5, 10); g.fillRect(x + 3, y - 30, 1.5, 16); if (i === 0) { g.fillStyle = V; g.beginPath(); g.moveTo(x + 4.5, y - 44); g.lineTo(x + 24, y - 38); g.lineTo(x + 4.5, y - 32); g.fill(); g.fillRect(x + 3, y - 44, 1.5, 30); } }
    g.strokeStyle = PC; g.lineWidth = 3; g.strokeRect(4, 4, W - 8, H - 8);
  })();

  // ---- painel ----
  document.getElementById('alm').innerHTML = D.recursos.slice(0, 6).map(r => `<div>${r.rot}<b>${r.v}</b></div>`).join('');
  const ob = document.getElementById('ordens'); ob.innerHTML = D.ordens.map((o, i) => `<button title="${o.desc}" aria-pressed="${i === 1}">${o.rot}</button>`).join('');
  ob.onclick = e => { const b = e.target.closest('button'); if (!b) return; ob.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
  const verso = document.getElementById('verso');
  function cantar(i) { const v = VERSOS[i % VERSOS.length]; verso.textContent = ''; let j = 0; const iv = setInterval(() => { verso.textContent = v.slice(0, ++j); if (j >= v.length) clearInterval(iv); }, 18); }
  cantar(0);

  const ficha = document.getElementById('ficha');
  function unitAt(m) { let b = null, bd = 1e9; C.UNIDADES.forEach(u => { const d = Math.hypot(u.p[0] - m[0], u.p[1] - m[1]) * cam.k; if (d < 18 && d < bd) { bd = d; b = u; } }); return b; }
  function clickAt(m) {
    const u = unitAt(m), s = C.stateAt(m[0], m[1]); sel = u; if (!u && !s) { ficha.hidden = true; return; }
    if (u) ficha.innerHTML = `<button class="fx" aria-label="Fechar">×</button><h4>${u.nome}</h4><i>${C.FAC[u.f].nome}</i><br>Gente em armas: <b>${u.forca.toLocaleString('pt-BR')}</b><br>Ânimo: <b>${u.moral}%</b> · Mantimento: <b>${u.sup}%</b><br>Situação: ${u.post}`;
    else { const c = C.controle(s.idx); ficha.innerHTML = `<button class="fx" aria-label="Fechar">×</button><h4>${s.n}</h4>Povo: ${s.pop.toLocaleString('pt-BR')} milhões · ${s.cap}<br>Na mão da UPR: <b>${Math.round(c[1] * 100)}%</b><br><i>${s.terTxt}</i>`; }
    ficha.hidden = false; const sp = cam.toScreen(m), r = document.getElementById('mapa-wrap').getBoundingClientRect();
    ficha.style.left = Math.max(10, Math.min(r.width - 270, sp[0] + 18)) + 'px'; ficha.style.top = Math.max(10, Math.min(r.height - ficha.offsetHeight - 10, sp[1] - 20)) + 'px';
    ficha.querySelector('.fx').onclick = () => { ficha.hidden = true; sel = null; };
  }
  const btn = document.getElementById('turno');
  btn.onclick = () => { btn.disabled = true; const flips = C.planTurn(); C.nextTurn(); let i = 0; const step = Math.max(4, Math.ceil(flips.length / 50)); const iv = setInterval(() => { for (let j = 0; j < step && i < flips.length; j++, i++) C.apply(flips[i]); dirty = true; if (i >= flips.length) { clearInterval(iv); btn.disabled = false; } }, 45); document.getElementById('mes').textContent = C.data().split(' ')[0].toUpperCase(); cantar(C.turno); };
  document.getElementById('zi').onclick = cam.zoomIn; document.getElementById('zo').onclick = cam.zoomOut; document.getElementById('zf').onclick = cam.fit;
  (function loop() { draw(); setTimeout(() => requestAnimationFrame(loop), 60); })();
})();
</script>
